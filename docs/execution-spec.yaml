  - id: arch.phase4.progress-bus-sse
    title: "Replace polling with SSE progress bus for extrapolation runs"
    phase: 4
    priority: P0
    est_days: 1.0
    why: |
      Implements C7. Today the frontend polls a status endpoint, which is both
      noisy and lossy on stage transitions. SSE gives push-based progress with
      one event per stage start/finish plus an optional partial-payload event
      for incremental UX.
    files_in_scope:
      - api/lib/extrapolation/orchestrator.js                # refactor (emit events on a bus)
      - api/lib/extrapolation/progress-bus.js                # new
      - api/lib/extrapolation/progress-bus.test.js           # new
      - api/routes/extrapolation/stream.js                   # new (GET /api/extrapolation/:runId/stream)
      - api/routes/_registry.js                              # refactor
      - api/routes/extrapolation/stream.routes.test.js       # new
    out_of_scope:
      - "Frontend wiring (next item)"
      - "Removing the polling endpoint (kept as fallback; deprecation in Phase 6)"
    api_contract:
      new_routes:
        - "GET /api/extrapolation/:runId/stream  -> text/event-stream"
      new_exports:
        - "createProgressBus() -> { emit(event), subscribe(cb) -> unsub, close() }"
      event_shape:
        - "{ type: 'stage:start' | 'stage:end' | 'run:end' | 'error', stageId?, payload?, ts }"
      schema_diff: none
