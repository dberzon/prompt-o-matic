      - "Every pre-existing entities row has project_id = 'proj_default'"
      - "migrations.test.js exercises apply → row counts → apply-again as no-op"
      - "The migration applies cleanly on top of the current schema.js HEAD migration"
    test_plan:
      - "migrations.test.js — apply migration on a fresh in-memory DB, assert table/columns/indices exist, assert backfill rows"
      - "Round-trip: write a canonical project row, read it back, assert equality"
    depends_on: []
    blocks:
      - arch.phase3.projects-repository
      - arch.phase3.bible-snapshots-migration
    risk: "Medium — schema migration on existing data. The backfill default project is critical for not orphaning existing rows."
    rollback: "Hard — DB schema migration. Mitigation: take a backup before applying; ship a down-migration sql for emergency restore."

