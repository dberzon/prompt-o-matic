      - "Per-project overrides — arch.phase3.per-project-prompt-overrides"
    api_contract:
      new_exports:
        - "loadRegistry({ libraryDir? }) -> Map<id, Map<version, PromptRecord>>"
        - "getPrompt(id, version?) -> PromptRecord  // version? defaults to highest"
        - "listPrompts() -> { id, version, description, tags }[]"
        - "type PromptRecord = { id, version, description, inputSchema?, outputSchema?, fewshot?, provider?, tags?, body }"
      new_routes: none
      schema_diff: none
      sql_migration: none
    acceptance_criteria:
