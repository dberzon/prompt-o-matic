# ─── Appendix A — Critical Path ─────────────────────────────────────────
# The longest chain of items that gates the autofill loop (the highest-value
# Phase 5 deliverable). Total: 11.0 engineer-days end-to-end.

appendix_a_critical_path:
  description: |
    Items below form the longest dependency chain through Phases 0-5. Any
    slip on these items slips the autofill-loop GA. Parallel-track everything
    else (e.g. P4 cost meter, P5 telemetry events) against this chain.
  total_engineer_days: 11.0
  chain:
    - { step: 1,  id: arch.phase0.llm-telemetry,                       est_days: 0.5 }
    - { step: 2,  id: arch.phase0.llm-client,                          est_days: 1.0 }
    - { step: 3,  id: arch.phase0.llm-structured-output,           est_days: 1.0 }
    - { step: 4,  id: arch.phase1.stages-use-client-chat,              est_days: 1.0 }
    - { step: 5,  id: arch.phase1.orchestrator-surfaces-drops,        est_days: 1.0 }
    - { step: 6,  id: arch.phase2.character-bible-schema,             est_days: 1.0 }
    - { step: 7,  id: arch.phase2.bible-projection,                    est_days: 1.0 }
    - { step: 8,  id: arch.phase5.tools-surface-scaffold,              est_days: 0.5 }
    - { step: 9,  id: arch.phase5.detect-gaps-tool,                    est_days: 0.5 }
    - { step: 10, id: arch.phase5.run-stage-tool,                      est_days: 0.5 }
    - { step: 11, id: arch.phase5.attribute-write-tool,                est_days: 0.5 }
    - { step: 12, id: arch.phase5.http-adapter,                        est_days: 0.5 }
    - { step: 13, id: arch.phase4.progress-bus-sse,                    est_days: 1.0 }
    - { step: 14, id: arch.phase5.autofill-gaps-loop,                  est_days: 1.0 }

