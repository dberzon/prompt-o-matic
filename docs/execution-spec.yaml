  - id: arch.phase0.llm-client
    title: "Introduce shared LlmClient factory"
    phase: 0
    priority: P0
    est_days: 0.75
    why: |
      Implements C1. Single entry point for every LLM call site; replaces the
      4 duplicate `llmGenerate` closures in vite.config.js and the 22-line
      shim in api/lib/extrapolation/llm.js. Forces every consumer through
      a single resolver + telemetry boundary.
    files_in_scope:
      - api/lib/llm/client.js                              # new
      - api/lib/llm/client.test.js                         # new
    out_of_scope:
      - "Migrating call sites (separate per-consumer issues)"
      - "Provider implementations under api/lib/llm/providers/* (preserved untouched)"
      - "Structured-output / schema wrapping (arch.phase0.llm-structured-output)"
    api_contract:
      new_exports:
        - "createLlmClient({ env?, fetchImpl?, telemetry?, resolver? }) -> { chat, raw }"
        - "chat({ promptId, version?, variables, schema?, retry? }) -> Promise<typed | string>"
        - "raw({ system, user, providerPayload }) -> Promise<string>"
      new_routes: none
      schema_diff: none
      sql_migration: none
    acceptance_criteria:
      - "api/lib/llm/client.js exports createLlmClient as a named export"
      - "createLlmClient().raw({system,user,providerPayload}) returns the same string runWithResolvedProvider returns for an identical input (parity test)"
      - "api/lib/llm/client.test.js covers raw path with a mock provider and asserts telemetry.record was called exactly once"
      - "ESM only — no `require()` introduced; lint passes"
    test_plan:
      - "api/lib/llm/client.test.js — mock provider; asserts raw() parity, telemetry hook invocation, env override propagation"
    depends_on: []
    blocks:
      - arch.phase0.llm-structured-output
      - arch.phase0.remove-duplicate-llmgenerate-closures
      - arch.phase1.stages-use-client-chat
      - arch.phase5.tool-registry
    risk: "Low — pure wrapper around the existing resolveProviderSelection + runWithResolvedProvider pair."
    rollback: "Revert the PR; no existing files modified beyond imports in the new test."

  - id: arch.phase0.llm-structured-output
    title: "Add callWithSchema (Zod validation + one repair retry)"
    phase: 0
    priority: P0
    est_days: 0.75
    why: |
      Implements C3. Centralizes JSON parsing, schema validation, and a single
      repair attempt before failure. Removes silent drops at the parser layer
      and produces a typed object for the caller.
    files_in_scope:
      - api/lib/llm/structuredOutput.js                    # new
      - api/lib/llm/structuredOutput.test.js               # new
      - api/lib/llm/errors.js                              # new
    out_of_scope:
      - "Switching stages.js to use this helper (arch.phase1.stages-use-client-chat)"
      - "Provider-side json_schema mode wiring (defer; this is a model-agnostic post-validator)"
    api_contract:
      new_exports:
        - "callWithSchema({ client, promptId, version?, variables, schema, maxRetries=1, onDrop? }) -> Promise<typed>"
        - "class LlmStructuredError extends Error { issues: ZodIssue[]; rawText: string }"
      new_routes: none
      schema_diff: none
      sql_migration: none
    acceptance_criteria:
      - "Valid JSON passes through and is returned typed (Zod parse result)"
      - "Invalid JSON triggers exactly one repair attempt before throwing LlmStructuredError"
      - "Throws LlmStructuredError (not generic Error) when both attempts fail; error includes issues[] and rawText"
      - "onDrop is invoked per-item for arrays where individual element validation fails"
    test_plan:
      - "api/lib/llm/structuredOutput.test.js — three cases: valid-first-try, repaired-second-try, fails-twice"
      - "Asserts onDrop callback invoked with { key, reason } for partial-array validation failure"
    depends_on:
      - arch.phase0.llm-client
    blocks:
      - arch.phase1.stages-use-client-chat
      - arch.phase1.parsers-emit-drop-diagnostics
    risk: "Low — pure post-processor; no provider changes."
    rollback: "Revert PR; nothing yet consumes callWithSchema."

