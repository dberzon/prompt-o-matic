  - id: arch.phase3.projects-migration
    title: "SQL migration: projects table + entities.project_id"
    phase: 3
    priority: P0
    est_days: 0.5
    why: |
      Implements C5 root. Adds the projects table and the project_id FK on
      entities. The columns project_id on characters / prompt_packs /
      generated_images already exist (per §3.5 of comprehensive_review.md and
      schema.js lines 3, 17, 30, 38) — this migration backfills them all into
      a 'default' project.
    files_in_scope:
      - api/lib/db/migrations/2026-05-add-projects.sql                          # new
      - api/lib/db/migrations/index.js                                          # refactor
