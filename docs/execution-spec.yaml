      new_exports:
        - "tool({ name, description, input: ZodSchema, output: ZodSchema, handler }) -> ToolDescriptor"
        - "registerTool(descriptor) -> void; getTool(name) -> ToolDescriptor; listTools() -> ToolDescriptor[]"
