      - "Bible snapshots migration (arch.phase3.bible-snapshots-migration)"
      - "Scenes (Phase 7)"
    api_contract:
      schema_diff: |
        CREATE TABLE projects (
          id TEXT PRIMARY KEY,
          slug TEXT UNIQUE NOT NULL,
          name TEXT NOT NULL,
          era_entity_id TEXT,
          active INTEGER NOT NULL DEFAULT 1,
          payload_json TEXT,
          created_at TEXT NOT NULL,
          updated_at TEXT NOT NULL
        );
        ALTER TABLE entities ADD COLUMN project_id TEXT REFERENCES projects(id);
        CREATE INDEX idx_entities_project_id ON entities(project_id);
        -- Backfill: every existing row in entities, characters, prompt_packs, generated_images
        -- gets project_id = 'proj_default'; a row in projects is inserted with that id and slug='default'.
      sql_migration: api/lib/db/migrations/2026-05-add-projects.sql
      new_exports: none
      new_routes: none
    acceptance_criteria:
