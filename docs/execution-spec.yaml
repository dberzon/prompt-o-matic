      - arch.phase5.run-stage-tool
      - arch.phase5.attribute-write-tool
      - arch.phase5.http-adapter
      - arch.phase4.progress-bus-sse
    blocks:
      - arch.phase5.autofill-button-frontend
    risk: "Medium — loop semantics are subtle. The three termination conditions and the 'unfillable gap skip' are the load-bearing invariants and are explicitly tested."
    rollback: "Revert PR; tools and bus remain usable for one-shot agent integrations."

