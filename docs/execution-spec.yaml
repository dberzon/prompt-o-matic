# ─── Appendix E — Open Questions (Need Product-Owner Decision) ──────────

appendix_e_open_questions:
  notes: |
    Each question must be resolved before the dependent item starts. Default
    answers are proposed where the engineering team can pre-commit if no
    answer is returned within the listed lead time.
  questions:
    - q_id: Q1
      blocks: arch.phase3.projects-migration
      question: |
        Is the project root mandatory for every entity (including pre-existing
        Characters created before Phase 3), or can entities live in a synthetic
        "default" project?
      proposed_default: |
        Synthetic "default" project created on migration; every legacy entity
        is assigned to it. Avoids a destructive migration.
      lead_time_days: 1
    - q_id: Q2
      blocks: arch.phase2.bible-projection
      question: |
        Are "recommended-but-missing" fields counted toward the completeness
        ring's percentage, or only required-but-missing?
      proposed_default: |
        Two-tier ring: outer arc = required, inner dot pattern = recommended.
        Percentage label tracks required only.
      lead_time_days: 1
    - q_id: Q3
      blocks: arch.phase3.approve-bible-route
      question: |
        Does "approving" a Bible snapshot freeze the projection, or only
        snapshot the current attributes (allowing the projection to keep
        evolving)?
      proposed_default: |
        Snapshot the current attributes; the projection (live view) keeps
        evolving. Approved snapshots are immutable historical records.
      lead_time_days: 1
    - q_id: Q4
      blocks: arch.phase3.bible-export
      question: |
        For PDF export: is a system tool (pandoc/weasyprint) acceptable, or
        must we use a Node-native lib?
      proposed_default: |
        Node-native (e.g. md-to-pdf or markdown-pdf) to keep `no external
        non-Node dep` consistent with the C8 decision. Accept lower fidelity.
      lead_time_days: 1
    - q_id: Q5
      blocks: arch.phase5.autofill-gaps-loop
      question: |
        What is the default token budget per autofill run? And should the user
        be able to override it from the BibleEditor button?
      proposed_default: |
        Default: 20k tokens. Hidden from UI in v1 (single hardcoded budget);
        surface a control in a later iteration if needed.
      lead_time_days: 1
    - q_id: Q6
      blocks: arch.phase5.mcp-server-stub
      question: |
        Is stdio transport sufficient for v1, or do we need an HTTP transport
        for the MCP server too?
      proposed_default: |
        Stdio only for v1. HTTP MCP transport deferred (the existing /api/tools
        HTTP adapter already covers HTTP consumers).
      lead_time_days: 1
    - q_id: Q7
      blocks: arch.phase3.per-project-prompt-overrides
      question: |
        For per-project prompt overrides: are they edited in-app (BibleEditor
        sidecar), or only via files in a project-scoped directory?
      proposed_default: |
        Files-only for v1, in `prompts/projects/{projectId}/`. In-app editor
        defers to a later iteration.
      lead_time_days: 1
    - q_id: Q8
      blocks: arch.phase1.migrate-polish-prompt
      question: |
        For the polish-prompt byte-equal snapshot test: do we compare against
        the prompt text *as rendered* (post variable substitution) for a fixed
        fixture, or against the raw template file?
      proposed_default: |
        Both. Raw template byte-equal AND rendered output for a canonical
        fixture must match the pre-migration baseline. The brief's hard
        constraint demands the strongest possible guarantee.
      lead_time_days: 1
