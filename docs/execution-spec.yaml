      - "Frontmatter parsed via Zod schema PromptFrontmatterSchema; missing required fields throw at load time with file path in message"
      - "getPrompt('nonexistent.id') throws PromptNotFoundError"
      - "getPrompt('id', version) returns exact version; getPrompt('id') returns highest version present"
    test_plan:
