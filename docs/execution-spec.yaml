# ─── Appendix C — Dependency Graph Validation ───────────────────────────

appendix_c_dependency_graph:
  cycles_found: none
  validation_method: |
    Each item declares depends_on and blocks. The union forms a directed
    graph over item IDs. A topological sort produced an order consistent
    with the phase numbering (Phase N items only depend on items in phases
    ≤ N), confirming no cycles. The chains below document the shared-file
    edges that gate the DAG and must be respected to keep the file-scope
    isolation invariant.
  shared_file_chains:
    - file: vite.config.js
      chain:
        - arch.phase0.remove-duplicate-llmgenerate-closures
        - arch.phase1.vite-llm-dedupe
        - arch.phase6.route-registry-skeleton          # appendix_d placeholder
        - arch.phase6.extract-chroma-supervisor        # appendix_d placeholder
        - arch.phase6.extract-comfy-sse-poller         # appendix_d placeholder
    - file: api/routes/_registry.js
      chain:
        - "All items that add a new route declare _registry.js in files_in_scope"
        - "Edits are append-only (one new line per route) — merge conflicts are mechanical"
        - "The route-registry-skeleton item (Phase 6) will replace this with a discovery glob; until then, sequence-by-dependency is enforced"
    - file: api/lib/extrapolation/orchestrator.js
      chain:
        - arch.phase1.orchestrator-surfaces-drops
        - arch.phase4.orchestrator-type-dispatch
        - arch.phase4.progress-bus-sse
    - file: api/lib/extrapolation/stages.js
      chain:
        - arch.phase1.stages-use-client-chat
        - arch.phase1.parsers-emit-drop-diagnostics
    - file: api/lib/extrapolation/stageRegistry.js
      chain:
        - arch.phase1.orchestrator-surfaces-drops
        - arch.phase4.orchestrator-type-dispatch
    - file: api/db/schema.js
      chain:
        - arch.phase2.character-bible-schema
        - arch.phase2.location-bible-schema
        - arch.phase3.projects-migration
        - arch.phase3.bible-snapshots-migration-and-repository
    - file: prompts/registry.js
      chain:
        - arch.phase0.prompt-registry
        - arch.phase1.migrate-polish-prompt
        - arch.phase4.location-stage-chain
        - arch.phase4.era-stage-chain
        - arch.phase3.per-project-prompt-overrides
    - file: src/components/BibleEditor.jsx
      chain:
        - arch.phase2.bible-editor-component
        - arch.phase2.completeness-ring
        - arch.phase3.approve-bible-route
        - arch.phase5.autofill-button-frontend
    - file: api/lib/tools/index.js
      chain:
        - arch.phase5.tools-surface-scaffold
        - arch.phase5.run-stage-tool
        - arch.phase5.detect-gaps-tool
        - arch.phase5.attribute-write-tool

